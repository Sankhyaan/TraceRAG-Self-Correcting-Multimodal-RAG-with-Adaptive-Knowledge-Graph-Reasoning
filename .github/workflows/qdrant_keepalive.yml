name: Qdrant Cloud Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 2 days at 06:00 UTC
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qdrant-client python-dotenv

      - name: Run Qdrant Keep-Alive Probe
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL || 'https://f1dd0814-91dd-44d8-9ace-a8453c7204a4.ca-central-1-0.aws.cloud.qdrant.io:6333' }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python scripts/qdrant_keepalive.py
